[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "framelift"
dynamic = ["version"]
description = "Upscale and restore videos with Real-ESRGAN — GPU when you have one, CPU when you don't."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Seu Nome" }]
keywords = ["video", "upscaling", "super-resolution", "real-esrgan", "restoration", "ffmpeg"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "tqdm>=4.60",
    "Pillow>=9",
    "torch>=1.7",
    "torchvision",
    "realesrgan>=0.3.0",
    "basicsr>=1.4.2",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]

[project.scripts]
framelift = "framelift.cli:main"

[project.urls]
Homepage = "https://github.com/SEU_USUARIO/framelift"
Issues = "https://github.com/SEU_USUARIO/framelift/issues"

[tool.setuptools.dynamic]
version = { attr = "framelift.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end tests that need PyTorch, Real-ESRGAN weights and FFmpeg"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N806"]  # RealESRGANer / RRDBNet are class names bound to local variables

[tool.ruff.lint.per-file-ignores]
# Tests favour readability: a CLI line split into words, explicit nested contexts.
"tests/*" = ["SIM905", "SIM117"]
