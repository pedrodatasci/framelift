[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "framelift"
dynamic = ["version"]
description = "Upscale, restore and smooth videos with Real-ESRGAN and RIFE, on an NVIDIA or Intel GPU or just the CPU."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSE-BasicSR.txt"]
requires-python = ">=3.9"
authors = [{ name = "Pedro Sofiati de Sá" }]
keywords = [
    "video", "upscaling", "super-resolution", "real-esrgan", "restoration",
    "frame-interpolation", "rife", "openvino", "ffmpeg",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Environment :: GPU :: NVIDIA CUDA",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "opencv-python>=4.8",
    "tqdm>=4.60",
    "Pillow>=9",
    "torch>=1.7",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.4"]
# The visual range picker (framelift trim / --pick-range). Also needs VLC media player.
picker = ["python-vlc>=3.0.12118"]
# OpenVINO: --backend openvino on CPU and --device igpu (Intel Iris/UHD/Arc GPUs).
intel = ["openvino>=2024.0"]

[project.scripts]
framelift = "framelift.cli:main"

[project.urls]
Homepage = "https://github.com/pedrodatasci/framelift"
Documentation = "https://github.com/pedrodatasci/framelift#readme"
"Documentação (pt-BR)" = "https://github.com/pedrodatasci/framelift/blob/main/README.pt-BR.md"
Changelog = "https://github.com/pedrodatasci/framelift/blob/main/CHANGELOG.md"
Issues = "https://github.com/pedrodatasci/framelift/issues"

[tool.setuptools.dynamic]
version = { attr = "framelift.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
framelift = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["slow: end-to-end tests that need PyTorch, Real-ESRGAN weights and FFmpeg"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = ["N806"]  # RealESRGANer / RRDBNet are class names bound to local variables

[tool.ruff.lint.per-file-ignores]
# Tests favour readability: a CLI line split into words, explicit nested contexts.
"tests/*" = ["SIM905", "SIM117"]
